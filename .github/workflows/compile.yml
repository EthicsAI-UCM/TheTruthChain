name: Compile files

on:
  # Triggers the workflow on push
  push:
    # No re-ejecutar cuando el propio workflow actualiza docs/
    paths-ignore:
      - 'docs/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama si llega una nueva
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para hacer push de docs/
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      - run: ./build.sh

      - name: Commit docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "docs: recompilar PDFs [skip ci]"
          git push
