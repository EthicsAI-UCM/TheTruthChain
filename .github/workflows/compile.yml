name: Compile files

on:
  # Triggers the workflow on push
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama si llega una nueva
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para hacer push a la rama documents
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v7
        with:
          path: src

      - name: Checkout documents branch
        uses: actions/checkout@v7
        with:
          ref: documents
          path: out

      - uses: typst-community/setup-typst@v5

      - name: Compile into the documents branch
        working-directory: src
        run: ./build.sh ../out

      - name: Commit and push PDFs
        working-directory: out
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "docs: recompilar PDFs [skip ci]"
          git push
